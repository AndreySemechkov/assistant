name: Docker Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKERHUB_IMAGE: ${{ secrets.MYDOCKERHUB_USERNAME }}/homelab

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: docker.io
          username: ${{ secrets.MYDOCKERHUB_USERNAME }}
          password: ${{ secrets.MYDOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=homelab-docker
          cache-to: type=gha,mode=max,scope=homelab-docker
